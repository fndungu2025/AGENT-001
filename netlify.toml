# Netlify builds this repo from the `main` branch on every push.
# Today it publishes the research docs site; when apps/web exists,
# switch to the app build (see research/tech-stack.md, Hosting).
[build]
  command = "bash scripts/build-site.sh"
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
