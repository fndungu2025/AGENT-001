# Netlify builds this repo from the `main` branch on every push.
# Published at /: the CustomerIQ analytics app (apps/web, runs entirely in the browser).
# Published at /research/: the research and planning documents (site/).
[build]
  command = "bash scripts/build-netlify.sh"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The app processes files locally and makes no network calls: connect-src is 'self' only.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/research/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
