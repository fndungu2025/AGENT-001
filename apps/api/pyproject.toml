[project]
name = "customeriq-api"
version = "0.1.0"
description = "CustomerIQ FastAPI service (REST + OpenAPI) and pipeline worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt[crypto]>=2.15",
    "httpx>=0.28",
    "cachetools>=7.2",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-cachetools>=7.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
